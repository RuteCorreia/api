trigger:
  branches:
    include:
      - QA02  # Ou 'QA' se você preferir que a build seja disparada a partir de outra branch

pool:
  vmImage: 'windows-latest'  # Usando uma máquina virtual do Azure DevOps com Windows

variables:
  buildConfiguration: 'Release'

steps:
# Usar a versão do .NET necessária
- script: |
    echo Installing .NET SDK
    curl -sSL https://dotnet.microsoft.com/download/dotnet/scripts/v1/dotnet-install.sh | bash /dev/stdin --version 8.x
  displayName: 'Install .NET SDK'

# Restaurar pacotes NuGet
- script: |
    echo Restoring NuGet packages
    dotnet restore
  displayName: 'Restore NuGet Packages'

# Construir o projeto
- script: |
    echo Building project
    dotnet build --configuration $(buildConfiguration)
  displayName: 'Build Project'

# Publicar artefatos gerados
- script: |
    echo Publishing artifacts
    dotnet publish --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)
  displayName: 'Publish Artifacts'

# Publicar os artefatos para o Azure DevOps
- publish: $(Build.ArtifactStagingDirectory)
  artifact: drop
  displayName: 'Publish Build Artifacts'
