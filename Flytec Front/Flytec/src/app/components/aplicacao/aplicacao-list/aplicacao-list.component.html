<app-navbar></app-navbar>
<div class="list row" id="lista">
    <div class="col-md-8">
      <div class="input-group mb-3">
        <input
          type="text"
          class="form-control"
          placeholder="Pesquisar por Status de Aplicação"
          [(ngModel)]="nome"
        />
        <div class="input-group-append">
          <button
            class="btn btn-outline-secondary"
            type="button"
          >
            Pesquisar
          </button>
        </div>
        <div class="input-group-append">
          <button
            class="btn btn-outline-secondary"
            type="button"
          >
          <a href="/novaAplicacao">Nova Aplicação</a>
          </button>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <h4>Listagem de Aplicações</h4>
      <ul class="list-group">
        @for (aplicacao of aplicacoes; track aplicacao.id; let i = $index) {
        <li
          class="list-group-item"
          [class.active]="i == currentIndex"
          (click)="setActiveAplicacao(aplicacao, i)"
          
        >
          {{ aplicacao.statusEnvio }}
        </li>
        }
      </ul>
    </div>
    <div class="col-md-6">
      <app-aplicacao-details
        [viewMode]="true"
        [currentAplicacao]="currentAplicacao"
      ></app-aplicacao-details>
    </div>
  </div>
