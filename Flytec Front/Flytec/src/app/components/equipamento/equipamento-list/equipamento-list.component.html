<app-navbar></app-navbar>
<div class="list row" id="lista">
    <div class="col-md-8">
      <div class="input-group mb-3">
        <input
          type="text"
          class="form-control"
          placeholder="Pesquisar por nome de Equipamento"
          [(ngModel)]="nome"
        />
        <div class="input-group-append">
          <button
            class="btn btn-outline-secondary"
            type="button"
          >
            Pesquisar
          </button>
        </div>
        <div class="input-group-append">
          <button
            class="btn btn-outline-secondary"
            type="button"
          >
          <a href="/novoEquipamento">Novo Equipamento</a>
          </button>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <h4>Listagem de Equipamentos</h4>
      <ul class="list-group">
        @for (equipamento of equipamentos; track equipamento.id; let i = $index) {
        <li
          class="list-group-item"
          [class.active]="i == currentIndex"
          (click)="setActiveEquipamento(equipamento, i)"
          
        >
          {{ equipamento.nome }}
        </li>
        }
      </ul>
    </div>
    <div class="col-md-6">
      <app-equipamento-details
        [viewMode]="true"
        [currentEquipamento]="currentEquipamento"
      ></app-equipamento-details>
    </div>
  </div>
