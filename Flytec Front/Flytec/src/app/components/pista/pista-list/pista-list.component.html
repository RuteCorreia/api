<app-navbar></app-navbar>
<div class="list row" id="lista">
    <div class="col-md-8">
      <div class="input-group mb-3">
        <input
          type="text"
          class="form-control"
          placeholder="Pesquisar por Nome de Pista"
          [(ngModel)]="nome"
        />
        <div class="input-group-append">
          <button
            class="btn btn-outline-secondary"
            type="button"
          >
            Pesquisar
          </button>
        </div>
        <div class="input-group-append">
          <button
            class="btn btn-outline-secondary"
            type="button"
          >
          <a href="/novaPista">Nova Pista</a>
          </button>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <h4>Listagem de Pistas</h4>
      <ul class="list-group">
        @for (pista of pistas; track pista.id; let i = $index) {
        <li
          class="list-group-item"
          [class.active]="i == currentIndex"
          (click)="setActivePista(pista, i)"
          
        >
          {{ pista.nome }}
        </li>
        }
      </ul>
    </div>
    <div class="col-md-6">
      <app-pista-details
        [viewMode]="true"
        [currentPista]="currentPista"
      ></app-pista-details>
    </div>
  </div>
