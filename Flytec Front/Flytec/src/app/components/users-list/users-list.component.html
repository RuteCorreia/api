<div class="list row">
    <div class="col-md-8">
      <div class="input-group mb-3">
        <input
          type="text"
          class="form-control"
          placeholder="Pesquisar por Nome de Usuário"
          [(ngModel)]="nome"
        />
        <div class="input-group-append">
          <button
            class="btn btn-outline-secondary"
            type="button"
            (click)="searchTitle()"
          >
            Pesquisar
          </button>
        </div>
        <div class="input-group-append">
          <button
            class="btn btn-outline-secondary"
            type="button"
          >
          <a href="/novoUsuario">Novo Usuário</a>
          </button>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <h4>Listagem de Usuários</h4>
      <ul class="list-group">
        @for (tutorial of tutorials; track tutorial.id; let i = $index) {
        <li
          class="list-group-item"
          [class.active]="i == currentIndex"
          (click)="setActiveTutorial(tutorial, i)"
        >
          {{ tutorial.nome }}
        </li>
        }
      </ul>
    </div>
    <div class="col-md-6">
      <app-users-details
        [viewMode]="true"
        [currentTutorial]="currentTutorial"
      ></app-users-details>
    </div>
  </div>
